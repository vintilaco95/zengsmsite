<!-- Modale tip TrustGSM: backdrop + cutie centrată; iframe-uri spre rutele embed -->
<div id="zgs-trust-calc-backdrop" class="zgs-trust-calc-backdrop" role="dialog" aria-modal="true" aria-labelledby="zgs-trust-calc-title">
  <div class="zgs-trust-calc-modal" role="document">
    <button type="button" class="zgs-trust-calc-close" aria-label="Închide calculatorul">×</button>
    <h2 class="zgs-trust-calc-title" id="zgs-trust-calc-title">Calculează prețul reparației</h2>
    <iframe class="zgs-trust-calc-iframe" title="Calculator prețuri reparații" src="/preturi/embed/" loading="lazy"></iframe>
  </div>
</div>

<div id="zgs-trust-status-backdrop" class="zgs-trust-status-backdrop" role="dialog" aria-modal="true" aria-labelledby="zgs-trust-status-title">
  <div class="zgs-trust-status-modal" role="document">
    <button type="button" class="zgs-trust-status-close" aria-label="Închide">×</button>
    <h2 class="zgs-trust-status-title" id="zgs-trust-status-title">Verifică status service</h2>
    <iframe class="zgs-trust-status-iframe" title="Verifică status service" src="/formulare/embed/" loading="lazy"></iframe>
  </div>
</div>
