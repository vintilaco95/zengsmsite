<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Calculator prețuri — ZEN GSM</title>
</head>
<body class="page-preturi zgs preturi-wizard-embed-body">
<nav></nav>
    <section class="price-calculator-section price-calculator-section--lead" id="price-wizard-root">
        <div class="container container--preturi-calc">
            <header class="preturi-calc-head">
                <h1 class="preturi-calc-heading gradient-text">Prețuri reparații</h1>
            </header>
            <div class="price-wizard-shell">
                <div id="price-wizard-boot" class="price-wizard-boot" role="status"></div>

                <div id="price-wizard-app" class="price-wizard-app" hidden>
                    <div class="price-wizard-progress" role="navigation" aria-label="Pași calculator">
                        <div class="price-wizard-progress-track">
                            <div class="price-wizard-progress-step" data-wizard-step="1">
                                <span class="price-wizard-progress-num">1</span>
                                <span class="price-wizard-progress-label">Marcă</span>
                            </div>
                            <div class="price-wizard-progress-step" data-wizard-step="2">
                                <span class="price-wizard-progress-num">2</span>
                                <span class="price-wizard-progress-label">Model</span>
                            </div>
                            <div class="price-wizard-progress-step" data-wizard-step="3">
                                <span class="price-wizard-progress-num">3</span>
                                <span class="price-wizard-progress-label">Reparație</span>
                            </div>
                            <div class="price-wizard-progress-step" data-wizard-step="4">
                                <span class="price-wizard-progress-num">4</span>
                                <span class="price-wizard-progress-label">Rezultat</span>
                            </div>
                        </div>
                    </div>

                    <div class="price-wizard-chips" id="price-wizard-chips" aria-live="polite"></div>

                    <div class="price-wizard-body">
                        <div class="price-wizard-panel" data-wizard-panel="1" id="price-panel-brand" role="tabpanel" aria-labelledby="price-wizard-title-brand">
                            <h3 class="price-wizard-panel-title price-wizard-panel-title--preturi" id="price-wizard-title-brand">Alege marca</h3>
                            <div class="price-wizard-scroll">
                                <div class="price-wizard-grid" id="price-brands-grid"></div>
                            </div>
                        </div>
                        <div class="price-wizard-panel" data-wizard-panel="2" id="price-panel-model" role="tabpanel" aria-labelledby="price-wizard-title-model" hidden>
                            <h3 class="price-wizard-panel-title price-wizard-panel-title--preturi" id="price-wizard-title-model">Alege modelul</h3>
                            <div class="price-wizard-scroll">
                                <div class="price-wizard-grid price-wizard-grid-models" id="price-models-grid"></div>
                            </div>
                        </div>
                        <div class="price-wizard-panel" data-wizard-panel="3" id="price-panel-repair" role="tabpanel" aria-labelledby="price-wizard-title-repair" hidden>
                            <h3 class="price-wizard-panel-title price-wizard-panel-title--preturi" id="price-wizard-title-repair">Alege tipul reparației</h3>
                            <div class="price-wizard-scroll">
                                <div class="price-wizard-grid price-wizard-grid-repairs" id="price-repairs-grid"></div>
                            </div>
                        </div>
                        <div class="price-wizard-panel price-wizard-panel-result" data-wizard-panel="4" id="price-panel-result" role="tabpanel" aria-labelledby="price-wizard-title-result" hidden>
                            <h3 class="price-wizard-panel-title price-wizard-sr-only" id="price-wizard-title-result">Estimare preț</h3>
                            <div class="calculator-result price-wizard-result-wrap" id="calculator-result"></div>
                        </div>
                    </div>

                    <div class="price-wizard-footer">
                        <button type="button" class="btn btn-secondary price-wizard-back-btn" id="price-wizard-back">
                            <i class="fa fa-arrow-left" aria-hidden="true"></i> Înapoi
                        </button>
                        <button type="button" class="btn btn-primary price-wizard-restart-btn" id="price-wizard-restart" hidden aria-label="Resetează calculatorul">
                            <i class="fa fa-refresh" aria-hidden="true"></i> Resetează
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>
<footer></footer>
</body>
</html>
